name: "⬟ Verify pentagonal website theme"

on:
  push:
    branches: [main]
    paths:
      - "src/routes/index.tsx"
      - "src/routes/__root.tsx"
      - "src/styles.css"
      - ".github/workflows/verify-pentagonal-theme.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "🔎 Locale wording gate and production build"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run existing multilingual release gate
        run: bun run gate:release
      - name: Verify production bundle
        run: bun run build
