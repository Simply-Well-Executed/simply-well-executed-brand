name: '⬟ Export Pentagonal XOR Brand Artwork'
on:
  push:
    branches: [main]
    paths:
      - 'public/downloads/pentagonal-xor-emblem/*.svg'
      - '.github/workflows/export-pentagonal-emblem.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-emblem-export
  cancel-in-progress: false

jobs:
  export:
    name: Render each SVG as archival PNG + maximum-quality JPEG
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install vector and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
      - name: Generate distinct raster images
        shell: bash
        run: |
          set -euo pipefail
          folder="public/downloads/pentagonal-xor-emblem"
          mkdir -p "$folder/jpeg" "$folder/png"
          for svg in "$folder"/*.svg; do
            name="$(basename "$svg" .svg)"
            png="$folder/png/$name.png"
            jpg="$folder/jpeg/$name.jpg"
            rsvg-convert --keep-aspect-ratio "$svg" -o "$png"
            convert "$png" -background white -alpha remove -alpha off -sampling-factor 4:4:4 -quality 100 "$jpg"
            test -s "$png"
            test -s "$jpg"
            identify "$png" "$jpg"
          done
          (
            cd "$folder"
            sha256sum *.svg jpeg/*.jpg png/*.png > SHA256SUMS
          )
      - name: Upload files as GitHub Actions artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pentagonal-xor-brand-artwork
          path: |
            public/downloads/pentagonal-xor-emblem/**/*.jpg
            public/downloads/pentagonal-xor-emblem/**/*.png
            public/downloads/pentagonal-xor-emblem/SHA256SUMS
          if-no-files-found: error
      # Read-only export: maintainers must review and commit derived assets separately.
